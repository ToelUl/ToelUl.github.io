name: Validate academic metadata

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate publication records
        run: python scripts/validate_publications.py
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Stage Scholar PDF
        run: |
          mkdir -p _site/publications/2026-adm-ashtekar
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/ToelUl/adm-to-ashtekar-notes/main/main.pdf \
            --output _site/publications/2026-adm-ashtekar/paper.pdf
          test -s _site/publications/2026-adm-ashtekar/paper.pdf
          test $(stat -c%s _site/publications/2026-adm-ashtekar/paper.pdf) -le 5242880
      - name: Package Pages artifact
        uses: actions/upload-pages-artifact@v4
