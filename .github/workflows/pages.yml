name: Deploy academic site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Stage Scholar PDF
        run: |
          mkdir -p _site/publications/2026-adm-ashtekar
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/ToelUl/adm-to-ashtekar-notes/main/main.pdf \
            --output _site/publications/2026-adm-ashtekar/paper.pdf
          test -s _site/publications/2026-adm-ashtekar/paper.pdf
          test $(stat -c%s _site/publications/2026-adm-ashtekar/paper.pdf) -le 5242880
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
